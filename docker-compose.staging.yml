services:
  postgres-staging:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jinlee_staging
      POSTGRES_USER: jinlee
      POSTGRES_PASSWORD: jinlee_staging_local
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinlee -d jinlee_staging"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - jinlee_staging_postgres:/var/lib/postgresql/data

volumes:
  jinlee_staging_postgres:
